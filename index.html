<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NUSANTARA FLIX</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="mb-4">NUSANTARA FLIX</h1>
      <button
        class="btn btn-primary mb-3"
        data-bs-toggle="modal"
        data-bs-target="#mediaModal"
        onclick="prepareCreate()"
      >
        Tambah media Baru
      </button>
      <div id="alertMessage" class="alert d-none" role="alert"></div>
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Judul</th>
              <th>Genre</th>
              <th>Tahun Rilis</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="mediaTableBody">
            <tr>
              <td colspan="5" class="text-center">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div
      class="modal fade"
      id="mediaModal"
      tabindex="-1"
      aria-labelledby="mediaModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-judul" id="mediaModalLabel">Tambah/Edit media</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="mediaForm">
              <input type="hidden" id="mediaId" />
              <div class="mb-3">
                <label for="judul" class="form-label">Judul media</label>
                <input type="text" class="form-control" id="judul" required />
              </div>
              <div class="mb-3">
                <label for="genre" class="form-label">Genre</label>
                <input type="text" class="form-control" id="genre" required />
              </div>
              <div class="mb-3">
                <label for="tahun_rilis" class="form-label">Tahun Rilis</label>
                <input
                  type="date"
                  class="form-control"
                  id="tahun_rilis"
                  required
                />
              </div>
              <button type="submit" class="btn btn-success" id="saveButton">
                Simpan
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
